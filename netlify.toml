# ==========================================
# PayPulse — Netlify Deployment Configuration
# Nuxt 3 / Nuxt 4 Compatibility Mode / Nitro
# ==========================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-term immutable caching for Vite/Nuxt hashed assets
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static icon and metadata caching
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# URL Redirects & Rewrites
[[redirects]]
  from = "/compare"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator"
  to = "/"
  status = 301
  force = true
